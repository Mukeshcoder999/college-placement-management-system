{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="form-container">

    <div class="form-box">

        <h2>Login</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Username</label>

                    <input
                    type="text"
                    name="username"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required>

            </div>

            <button
                type="submit"
                class="btn register-btn">

                Login

            </button>

        </form>

    </div>

</div>

{% endblock %}
